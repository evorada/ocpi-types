[package]
name = "ocpi-types"
version = "0.0.0"
edition = "2021"
description = "Auto-generated type definitions for the OCPI (Open Charge Point Interface) protocol."
license = "AGPL-3.0-or-later"
repository = "https://github.com/evorada/ocpi-types"
keywords = ["ocpi", "emsp", "cpo", "electromobility"]
categories = ["api-bindings"]

# Each OCPI version is exposed as a module in lib.rs (generated by `make rust`).
[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
